<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>НСИ — справочники подготовки ВС</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235563ff'/%3E%3Cpath d='M7 21h18M7 16h12M7 11h6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="app.css">
  <script>
    // Тема применяется до отрисовки, чтобы страница не мигала.
    try {
      var t = localStorage.getItem('nsi.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* хранилище недоступно — остаётся системная тема */ }
  </script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 17h14M5 12h9M5 7h4.5"/></svg></span>
        <span class="brand-text">
          <strong>НСИ</strong>
          <small>Справочники ВС</small>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Разделы"></nav>
      <div class="side-foot">
        <a href="swagger-ui.html" target="_blank" rel="noopener">Swagger UI ↗</a>
        <p>Учебные данные.<br>Не для эксплуатации в авиации.</p>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <span class="top-label">Демо-роль определяет доступные действия</span>
        <div class="role" role="radiogroup" aria-label="Демо-роль" id="roles"></div>
        <button class="icon-btn" id="theme" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A6.5 6.5 0 0 1 12 3z" fill="currentColor"/></svg>
        </button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
